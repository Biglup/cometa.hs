name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  haskell:
    name: GHC ${{ matrix.ghc }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ghc: '9.6.7'
          - os: ubuntu-24.04
            ghc: '9.10.3'
          - os: ubuntu-24.04-arm
            ghc: '9.6.7'
          - os: macos-15
            ghc: '9.6.7'
          - os: macos-15-intel
            ghc: '9.6.7'
          - os: windows-2022
            ghc: '9.6.7'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.12.1.0'
          cabal-update: false
      - name: Configure secure package repository and update index
        run: |
          cabal user-config init --force --augment=$'repository hackage.haskell.org\n  url: https://hackage.haskell.org/\n  secure: True'
          cabal update
      - name: Read native source pin
        id: pin
        run: echo "revision=$(cat native/cardano-c.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Biglup/cardano-c
          ref: ${{ steps.pin.outputs.revision }}
          path: .native/cardano-c
          persist-credentials: false
      - name: Build pinned native static library
        id: native
        run: python tools/build-native.py .native/cardano-c .native/build --configure-cabal
      - name: Build with warnings as errors
        run: cabal build all
      - name: Run tests and example
        run: |
          cabal test all --test-show-details=direct
          cabal run cometa-hash
          cabal run cometa-cbor
          cabal run cometa-signing
          cabal run cometa-bip32
          cabal run cometa-bip39
          cabal run cometa-password-crypto
          cabal run cometa-derivation-paths
          cabal run cometa-software-key-handler
          python tools/check-key-handler-roles.py
      - name: Exercise optimized pure crypto evaluation and concurrency
        run: |
          cabal test cometa-test --enable-optimization=2 --test-show-details=direct --test-options="-p BIP39 +RTS -N2 -RTS"
          cabal test cometa-test --enable-optimization=2 --test-show-details=direct --test-options="-p PBKDF2 +RTS -N2 -RTS"
      - name: Build Haddock
        run: cabal haddock lib:cometa --haddock-for-hackage --haddock-hyperlink-source
      - uses: actions/upload-artifact@v4
        with:
          name: haddock-${{ matrix.os }}-ghc-${{ matrix.ghc }}
          path: dist-newstyle/build/*/ghc-*/cometa-*/doc/html/cometa-*-docs/
          if-no-files-found: error
      - name: Check package and build source distribution consumer
        env:
          NATIVE_INCLUDE_DIR: ${{ steps.native.outputs.include-dir }}
          NATIVE_LIBRARY_DIR: ${{ steps.native.outputs.library-dir }}
        run: |
          cabal check
          cabal sdist --output-directory=.sdist
          consumer_dir="$RUNNER_TEMP/cometa-consumer"
          if [ "$RUNNER_OS" = "Windows" ]; then
            consumer_dir="$(cygpath -u "$RUNNER_TEMP")/cometa-consumer"
          fi
          mkdir -p "$consumer_dir"
          tar -xzf .sdist/cometa-*.tar.gz -C "$consumer_dir"
          cd "$consumer_dir"/cometa-*
          cabal build all --extra-include-dirs="$NATIVE_INCLUDE_DIR" --extra-lib-dirs="$NATIVE_LIBRARY_DIR"
          cabal test all --test-show-details=direct --extra-include-dirs="$NATIVE_INCLUDE_DIR" --extra-lib-dirs="$NATIVE_LIBRARY_DIR"
      - name: Check native allocations with Valgrind
        if: matrix.os == 'ubuntu-24.04' && matrix.ghc == '9.6.7'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          timeout 240s valgrind --fair-sched=yes --leak-check=full --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect --error-exitcode=1 "$(cabal list-bin cometa-test)" --num-threads=1 +RTS -N2 -RTS

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned style tools from official releases
        run: |
          mkdir -p "$RUNNER_TEMP/style-bin"
          curl --fail --location https://github.com/tweag/ormolu/releases/download/0.8.0.2/ormolu-x86_64-linux.zip -o "$RUNNER_TEMP/ormolu.zip"
          echo "f737b11835537d020d83a497903a392f19d4943aea03b75f76f1c5719d70f9f8  $RUNNER_TEMP/ormolu.zip" | sha256sum --check
          unzip -j "$RUNNER_TEMP/ormolu.zip" -d "$RUNNER_TEMP/style-bin"
          curl --fail --location https://github.com/ndmitchell/hlint/releases/download/v3.8/hlint-3.8-x86_64-linux.tar.gz -o "$RUNNER_TEMP/hlint.tar.gz"
          echo "882363872064c70801858b4e9fa17468531fc30b91ed5b8d260eb48fc90b3e61  $RUNNER_TEMP/hlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/hlint.tar.gz" -C "$RUNNER_TEMP/style-bin" --strip-components=1
      - name: Check native adapter formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 --dry-run --Werror cbits/*.c cbits/*.h test/cbits/*.c
      - name: Check formatting and lint
        run: |
          find src internal test examples \( -name '*.hs' -o -name '*.hsc' \) -print0 | xargs -0 "$RUNNER_TEMP/style-bin/ormolu" --mode check
          "$RUNNER_TEMP/style-bin/hlint" src internal test examples

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build strict guide and check links
        run: |
          python -m sphinx -n -W --keep-going -b html docs/userguide docs/_build/html
          python -m sphinx -n -W --keep-going -b linkcheck docs/userguide docs/_build/linkcheck
      - uses: actions/upload-artifact@v4
        with:
          name: user-guide
          path: docs/_build/html/
          if-no-files-found: error
      - name: Read native source pin
        id: pin
        run: echo "revision=$(cat native/cardano-c.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Biglup/cardano-c
          ref: ${{ steps.pin.outputs.revision }}
          path: .native/cardano-c
          persist-credentials: false
      - name: Verify public API inventory and source manifests
        run: python tools/native-inventory.py .native/cardano-c
